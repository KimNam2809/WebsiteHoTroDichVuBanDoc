server:
  port: 8000

spring:
  application:
    name: website-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db.zopeuzvomcgdbtmlnjin.supabase.co:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_key_should_be_at_least_256_bits_long_and_secure_placeholder}
  expiration: 604800000 # 7 ngày (milliseconds)

groq:
  api-key: ${GROQ_API_KEY:your_groq_api_key_here}
  url: https://api.groq.com/openai/v1/chat/completions
  model: llama-3.3-70b-versatile

supabase:
  url: ${SUPABASE_URL:https://zopeuzvomcgdbtmlnjin.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:your_supabase_service_role_key_here}
  storage-bucket-books: image_books
  storage-bucket-cards: card_requests
